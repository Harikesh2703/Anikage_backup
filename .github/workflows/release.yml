name: Build and Release Anikage

on:
  push:
    tags:
      - 'v*' # This triggers the build when you push a tag like v1.0.0

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        # This starts a Windows and a Mac computer in the cloud simultaneously
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      # This is the magic part that fixes the SQLite Linux-vs-Windows bug
      - name: Rebuild Native Modules
        run: npx electron-rebuild -f -w sqlite3

      - name: Build and Publish
        run: npm run dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
