name: Build and Release Anikage

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # <--- ADD THIS LINE (make sure it has 2 spaces in front)

jobs:
# ... the rest of the file stays the same
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        # This starts a Windows and a Mac computer in the cloud simultaneously
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      # This is the magic part that fixes the SQLite Linux-vs-Windows bug
      - name: Rebuild Native Modules (SQLite Fix)
        # Using version 41.5.0 from your devDependencies
        run: npx @electron/rebuild -f -w sqlite3 -v 41.5.0

      - name: Build and Publish Electron App
        run: npm run dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This helps avoid certificate errors on Mac during the build process
          CSC_IDENTITY_AUTO_DISCOVERY: false
