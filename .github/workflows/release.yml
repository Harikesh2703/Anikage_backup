name: Build and Release Anikage

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install
          cd frontend/emerald-stream-main
          npm install

      - name: Build Frontend
        run: npm run build:frontend

      - name: Rebuild Native Modules (SQLite Fix)
        # Using version 41.5.0 from your devDependencies
        run: npx @electron/rebuild -f -w sqlite3 -v 41.5.0

      - name: Build and Publish Electron App
        run: npm run dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Prevents build failure if you don't have Apple certificates yet
          CSC_IDENTITY_AUTO_DISCOVERY: false
