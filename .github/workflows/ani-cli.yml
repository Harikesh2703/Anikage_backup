name: 'Anikage checks'
on:
  push:
    branches:
      - master
  pull_request:
    paths:
      - "**bin/**"
      - "**src/**"
      - "**server/**"

jobs:
  lint:
    name: Lint and Format
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    - name: Install dependencies
      run: npm install
    - name: Run linter
      run: npm run lint || true
